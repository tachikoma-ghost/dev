services:
  dev:
    build: .
    volumes:
      - type: bind
        source: ../
        target: /workspace
        read_only: false
      - type: bind
        source: ../dev
        target: /workspace/dev
        read_only: true
      - type: bind
        source: ./setup
        target: /setup
        read_only: true
      - type: bind
        source: ./nvim
        target: /home/node/.config/nvim
        read_only: false
      - type: bind
        source: ./cache/nvim
        target: /home/node/.local/share/nvim
        read_only: false
    command: /bin/bash -c "echo ready; sleep infinity"
  ollama:
    image: ollama/ollama
    volumes:
      - type: bind
        source: ../ollama
        target: /root/.ollama
    deploy:
      resources:
        limits:
          cpus: "1.5"
  expo-builder:
    #image: reactnativecommunity/react-native-android:latest
    build:
      context: .
      dockerfile: expo-builder.Dockerfile
    volumes:
      - type: bind
        source: ../apps
        target: /apps
      - type: bind
        source: ../src/builder/build-server.js
        target: /build-server.js
        read_only: true
    command: node --watch /build-server.js
    deploy:
      resources:
        limits:
          cpus: "1.5"
