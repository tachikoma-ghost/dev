services:
  dev:
    build: .
    volumes:
      - type: bind
        source: ../
        target: /workspace
        read_only: false
      - type: bind
        source: ../dev
        target: /workspace/dev
        read_only: true
      - type: bind
        source: ./setup
        target: /setup
        read_only: true
      - type: bind
        source: ./nvim
        target: /home/node/.config/nvim
        read_only: false
      - type: bind
        source: ./cache/nvim
        target: /home/node/.local/share/nvim
        read_only: false
    # Only needed for rootless Docker-in-Docker; uncomment together with the
    # `RUN /setup/dind.sh` line in the Dockerfile. That script declares its own
    # section3 service. Without this block the container cannot create a user
    # namespace (Docker's default seccomp profile blocks clone(CLONE_NEWUSER)
    # without CAP_SYS_ADMIN) and the rootless daemon will not start.
    #
    # What this costs: a wider kernel attack surface. userns plus mount reach
    # code paths with a history of local privilege escalation bugs
    # (CVE-2022-0185, CVE-2023-0386). What it does not cost: any new authority
    # over the host. No capabilities are added, block devices cannot be mounted
    # inside a user namespace, container root maps to node's unprivileged uid,
    # and inherited mounts keep their locked flags — the read-only bind of ../dev
    # below cannot be remounted rw or unmounted to reveal what it covers.
    #
    # apparmor=unconfined is a no-op unless AppArmor is enabled on the host;
    # check before keeping it. Narrowing seccomp to a custom profile instead of
    # unconfined is possible but has to allow mount, unshare, setns, pivot_root
    # and the new mount API, so it buys less than it looks like it should.
    #security_opt:
    #  - seccomp=unconfined
    #  - apparmor=unconfined
    command: /bin/bash -c "echo ready; sleep infinity"
  ollama:
    image: ollama/ollama
    volumes:
      - type: bind
        source: ../ollama
        target: /root/.ollama
    deploy:
      resources:
        limits:
          cpus: "1.5"
  expo-builder:
    #image: reactnativecommunity/react-native-android:latest
    build:
      context: .
      dockerfile: expo-builder.Dockerfile
    volumes:
      - type: bind
        source: ../apps
        target: /apps
      - type: bind
        source: ../src/builder/build-server.js
        target: /build-server.js
        read_only: true
    command: node --watch /build-server.js
    deploy:
      resources:
        limits:
          cpus: "1.5"
