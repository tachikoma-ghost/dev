services:
  dev:
    build: .
    volumes:
      - type: bind
        source: ../
        target: /workspace
        read_only: false
      - type: bind
        source: ../dev
        target: /workspace/dev
        read_only: true
      - type: bind
        source: ./setup
        target: /setup
        read_only: true
      - type: bind
        source: ./nvim
        target: /home/node/.config/nvim
        read_only: false
      - type: bind
        source: ./cache/nvim
        target: /home/node/.local/share/nvim
        read_only: false
    command: /bin/bash -c "echo ready; sleep infinity"
  ollama:
    image: ollama/ollama
    volumes:
      - type: bind
        source: ../ollama
        target: /root/.ollama
  expo-builder:
    image: reactnativecommunity/react-native-android:latest
    volumes:
      - type: bind
        source: ../src/builder/output
        target: /apps
      - type: bind
        source: ../src/builder/build-server.js
        target: /build-server.js
        read_only: true
    ports:
      - "3000:3000"
    command: node /build-server.js
