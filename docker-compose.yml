services:
  dev:
    build: .
    hostname: ${DEV_HOSTNAME:?set by bin/dev from the project name}
    volumes:
      - type: bind
        source: ../
        target: /workspace
        read_only: false
      - type: bind
        source: ../dev
        target: /workspace/dev
        read_only: true
      - type: bind
        source: ./setup
        target: /setup
        read_only: true
      - type: bind
        source: ./nvim
        target: /home/node/.config/nvim
        read_only: false
      - type: bind
        source: ./cache/nvim
        target: /home/node/.local/share/nvim
        read_only: false
    # The daemon runs in a VM on the host, so nothing here creates a user
    # namespace and the security_opt block rootless DinD needed is gone.
    environment:
      DOCKER_HOST: ${DOCKER_HOST:-tcp://host.docker.internal:2375}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: /bin/bash -c "echo ready; sleep infinity"
