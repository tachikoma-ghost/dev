services:
  dev:
    build: .
    hostname: ${DEV_HOSTNAME:?set by bin/dev from the project name}
    volumes:
      - type: bind
        source: ../
        target: /workspace
        read_only: false
      - type: bind
        source: ../dev
        target: /workspace/dev
        read_only: true
      - type: bind
        source: ./setup
        target: /setup
        read_only: true
      - type: bind
        source: ./nvim
        target: /home/node/.config/nvim
        read_only: false
      - type: bind
        source: ./cache/nvim
        target: /home/node/.local/share/nvim
        read_only: false
      #- type: bind
      #  source: /var/run/docker.sock
      #  target: /var/run/docker.sock
    # Required for rootless Docker-in-Docker; see README.md.
    #security_opt:
    #  - seccomp=unconfined
    #  - apparmor=unconfined
    command: /bin/bash -c "echo ready; sleep infinity"
