services:
  dev:
    build: .
    hostname: ${DEV_HOSTNAME:?set by bin/dev from the project name}
    volumes:
      - type: bind
        source: ../
        target: /workspace
        read_only: false
      - type: bind
        source: ../dev
        target: /workspace/dev
        read_only: true
      - type: bind
        source: ./setup
        target: /setup
        read_only: true
      - type: bind
        source: ./nvim
        target: /home/node/.config/nvim
        read_only: false
      - type: bind
        source: ./cache/nvim
        target: /home/node/.local/share/nvim
        read_only: false
    # Required for rootless Docker-in-Docker; see README.md.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    # newuidmap writes the child's uid_map, which needs ptrace access to it.
    # Under kernel.yama.ptrace_scope=1 only ancestors have that, and newuidmap
    # is the child's sibling, so without this the map fails with EPERM.
    cap_add:
      - SYS_PTRACE
    command: /bin/bash -c "echo ready; sleep infinity"
