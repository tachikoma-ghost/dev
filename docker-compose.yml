services:
  dev:
    build: .
    hostname: ${DEV_HOSTNAME:?set by bin/dev from the project name}
    volumes:
      - type: bind
        source: ../
        target: /workspace
        read_only: false
      - type: bind
        source: ../dev
        target: /workspace/dev
        read_only: true
      - type: bind
        source: ./setup
        target: /setup
        read_only: true
      - type: bind
        source: ./nvim
        target: /home/node/.config/nvim
        read_only: false
      - type: bind
        source: ./cache/nvim
        target: /home/node/.local/share/nvim
        read_only: false
    # No security_opt block: the image is booted as a VM by bin/devvm, so
    # nothing here creates a user namespace.
    command: /bin/bash -c "echo ready; sleep infinity"
